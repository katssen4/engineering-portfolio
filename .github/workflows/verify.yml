# Fait tourner tools/verify.py a chaque poussee, pour que le lecteur n'ait pas a croire
# sur parole que le depot passe son propre controle.
#
# Tout est epingle par empreinte : les deux actions par SHA de commit, pytest par version
# exacte dans requirements-ci.txt. Un tag majeur comme @v7 bouge, et une revue exterieure a
# releve le 2026-09-10 que le commentaire de ce fichier annoncait un epinglage qu'il ne
# faisait pas. La version de Python reste sur 3.12, ce qui laisse flotter le correctif :
# c'est assume, la chaine n'exige rien d'un correctif precis.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python3 tools/verify.py
